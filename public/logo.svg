<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14281C"/>
      <stop offset="100%" stop-color="#0A140E"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DE9C"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA822A"/>
      <stop offset="100%" stop-color="#E5CA78"/>
    </linearGradient>
    <linearGradient id="logoLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9BC677"/>
      <stop offset="50%" stop-color="#6F9D4C"/>
      <stop offset="100%" stop-color="#3A6328"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem Group (scaled and positioned) -->
  <g transform="translate(18, 16) scale(0.25)">
    <!-- Base -->
    <rect width="512" height="512" rx="112" fill="url(#logoBg)"/>
    <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#logoGold)" stroke-width="3" stroke-opacity="0.45"/>
    
    <!-- Grid -->
    <g opacity="0.22" stroke="url(#logoGold)" stroke-width="1.8">
      <line x1="166" y1="110" x2="166" y2="400"/>
      <line x1="211" y1="90" x2="211" y2="420"/>
      <line x1="256" y1="80" x2="256" y2="430"/>
      <line x1="301" y1="90" x2="301" y2="420"/>
      <line x1="346" y1="110" x2="346" y2="400"/>
      <line x1="130" y1="220" x2="382" y2="220"/>
      <line x1="130" y1="280" x2="382" y2="280"/>
    </g>

    <!-- W Stem -->
    <path d="M 148 160 L 198 350 L 256 250 L 314 350 L 364 160" 
          fill="none" 
          stroke="url(#logoGold)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <path d="M 148 160 L 198 350 L 256 250 L 314 350 L 364 160" 
          fill="none" 
          stroke="#FFF8E0" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.9"/>

    <!-- Basin Arch -->
    <path d="M 170 375 C 210 415, 302 415, 342 375" 
          fill="none" 
          stroke="url(#logoGold)" 
          stroke-width="6" 
          stroke-linecap="round"/>

    <!-- Leaves -->
    <path d="M 256 100 C 240 140, 246 195, 256 220 C 266 195, 272 140, 256 100 Z" fill="url(#logoLeaf)" stroke="url(#logoGold)" stroke-width="3"/>
    <path d="M 218 135 C 195 155, 192 195, 215 212 C 232 190, 230 160, 218 135 Z" fill="url(#logoLeaf)" stroke="url(#logoGold)" stroke-width="2.5"/>
    <path d="M 294 135 C 317 155, 320 195, 297 212 C 280 190, 282 160, 294 135 Z" fill="url(#logoLeaf)" stroke="url(#logoGold)" stroke-width="2.5"/>
    <path d="M 152 145 C 130 160, 132 192, 156 200 C 166 182, 168 160, 152 145 Z" fill="url(#logoLeaf)" stroke="url(#logoGold)" stroke-width="2.5"/>
    <path d="M 360 145 C 382 160, 380 192, 356 200 C 346 182, 344 160, 360 145 Z" fill="url(#logoLeaf)" stroke="url(#logoGold)" stroke-width="2.5"/>
    <path d="M 256 242 C 238 275, 240 310, 256 332 C 272 310, 274 275, 256 242 Z" fill="url(#logoLeaf)" stroke="url(#logoGold)" stroke-width="2.5"/>

    <!-- Finial -->
    <polygon points="256,66 266,80 256,94 246,80" fill="url(#logoGold)"/>
  </g>

  <!-- Typography: Luxury Architectural Brandmark -->
  <!-- Main Title -->
  <text x="172" y="74" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
        font-size="36" 
        font-weight="600" 
        letter-spacing="0.08em" 
        fill="#F4F3EC">
    WALL <tspan fill="url(#logoGold)" font-style="italic" font-weight="400">of</tspan> GARDENS
  </text>

  <!-- Subtitle Line -->
  <line x1="174" y1="92" x2="610" y2="92" stroke="url(#logoGold)" stroke-width="1" stroke-opacity="0.35"/>
  
  <text x="174" y="114" 
        font-family="'IBM Plex Mono', 'Courier New', monospace" 
        font-size="11.5" 
        font-weight="500" 
        letter-spacing="0.22em" 
        fill="#C8A55B">
    LIVING ARCHITECTURE · NEW DELHI
  </text>
</svg>
