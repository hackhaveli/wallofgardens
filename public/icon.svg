<svg viewBox="0 0 640 640" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wog-bg { fill: #111E17; }
      .wog-tile { fill: #F6F3EA; }
      .wog-stroke { stroke: #111E17; fill: none; }
      .wog-fill { fill: #111E17; }
      .wog-leaf {
        transform-origin: 528px 320px;
        animation: leafBreeze 3.5s ease-in-out infinite;
      }
      @keyframes leafBreeze {
        0%, 100% { transform: rotate(0deg) scale(1); }
        25% { transform: rotate(-7deg) scale(1.08); }
        60% { transform: rotate(5deg) scale(0.97); }
        80% { transform: rotate(-3deg) scale(1.03); }
      }
    </style>
    <clipPath id="wcl_icon">
      <rect x="11" y="13" width="34" height="31" />
    </clipPath>
  </defs>

  <!-- Dark Luxury Green Background matching uploaded logo -->
  <rect class="wog-bg" width="640" height="640" rx="64" />

  <!-- Tile 1: W -->
  <rect class="wog-tile" x="76" y="244" width="152" height="152" rx="16" />
  <g transform="translate(76, 244) scale(2.7142857)">
    <path clip-path="url(#wcl_icon)" d="M11 9 L21 48 L28 27 L35 48 L45 9" class="wog-stroke" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt" />
  </g>

  <!-- Tile 2: O -->
  <rect class="wog-tile" x="244" y="244" width="152" height="152" rx="16" />
  <g transform="translate(244, 244) scale(2.7142857)">
    <circle cx="28" cy="28" r="15.5" class="wog-stroke" stroke-width="6.5" />
  </g>

  <!-- Tile 3: G with Leaf Sprout -->
  <rect class="wog-tile" x="412" y="244" width="152" height="152" rx="16" />
  <g transform="translate(412, 244) scale(2.7142857)">
    <path d="M40.5 17.5 A15.5 15.5 0 1 0 43 33 L43 28 L29 28" class="wog-stroke" stroke-width="6.5" />
    <path class="wog-leaf" d="M37 15 C37 9 41 5.5 48 6 C48 12 44 15.5 37 15Z" class="wog-fill" />
  </g>
</svg>
