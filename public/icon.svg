<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14281C"/>
      <stop offset="50%" stop-color="#0E1B13"/>
      <stop offset="100%" stop-color="#070E0A"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DE9C"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA822A"/>
      <stop offset="100%" stop-color="#E5CA78"/>
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9BC677"/>
      <stop offset="50%" stop-color="#6F9D4C"/>
      <stop offset="100%" stop-color="#3A6328"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Architectural Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.45"/>
  <rect x="32" y="32" width="448" height="448" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="8 6"/>

  <!-- Architectural Living Wall Slat Grid (The "Wall") -->
  <g opacity="0.18" stroke="url(#goldGrad)" stroke-width="1.5">
    <!-- Vertical structural posts -->
    <line x1="166" y1="110" x2="166" y2="400"/>
    <line x1="211" y1="90" x2="211" y2="420"/>
    <line x1="256" y1="80" x2="256" y2="430"/>
    <line x1="301" y1="90" x2="301" y2="420"/>
    <line x1="346" y1="110" x2="346" y2="400"/>
    
    <!-- Horizontal tier wires -->
    <line x1="140" y1="160" x2="372" y2="160"/>
    <line x1="130" y1="220" x2="382" y2="220"/>
    <line x1="130" y1="280" x2="382" y2="280"/>
    <line x1="140" y1="340" x2="372" y2="340"/>
  </g>

  <!-- Stylized Biophilic "W" Monogram & Trellis Arch -->
  <!-- Left stem of W -->
  <path d="M 148 160 L 198 350 L 256 250 L 314 350 L 364 160" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#goldGlow)"/>

  <!-- Inner precision stem highlights -->
  <path d="M 148 160 L 198 350 L 256 250 L 314 350 L 364 160" 
        fill="none" 
        stroke="#FFF8E0" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.8"/>

  <!-- Lower architectural pedestal / garden basin (Forms subtle "G") -->
  <path d="M 170 375 C 210 415, 302 415, 342 375" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round"/>
  
  <path d="M 216 405 C 238 418, 274 418, 296 405" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        opacity="0.6"/>

  <!-- Living Wall Foliage: Sculpted Botanical Leaves sprouting from structure -->
  <!-- Center Crown Leaf (Vertical Accent) -->
  <path d="M 256 100 C 240 140, 246 195, 256 220 C 266 195, 272 140, 256 100 Z" 
        fill="url(#leafGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="2.5"/>
  <line x1="256" y1="125" x2="256" y2="210" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Left Upper Leaf -->
  <path d="M 218 135 C 195 155, 192 195, 215 212 C 232 190, 230 160, 218 135 Z" 
        fill="url(#leafGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="2"/>
  <path d="M 206 175 C 214 180, 222 188, 224 198" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>

  <!-- Right Upper Leaf -->
  <path d="M 294 135 C 317 155, 320 195, 297 212 C 280 190, 282 160, 294 135 Z" 
        fill="url(#leafGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="2"/>
  <path d="M 306 175 C 298 180, 290 188, 288 198" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>

  <!-- Left Outer Sprout Leaf -->
  <path d="M 152 145 C 130 160, 132 192, 156 200 C 166 182, 168 160, 152 145 Z" 
        fill="url(#leafGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="2"/>

  <!-- Right Outer Sprout Leaf -->
  <path d="M 360 145 C 382 160, 380 192, 356 200 C 346 182, 344 160, 360 145 Z" 
        fill="url(#leafGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="2"/>

  <!-- Center Heart Leaves (Lower Interlocking Nodes) -->
  <path d="M 256 242 C 238 275, 240 310, 256 332 C 272 310, 274 275, 256 242 Z" 
        fill="url(#leafGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="2"/>
  <line x1="256" y1="260" x2="256" y2="320" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Left Lower Leaf -->
  <path d="M 198 335 C 172 335, 165 305, 185 285 C 196 304, 202 320, 198 335 Z" 
        fill="url(#leafGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="2"/>

  <!-- Right Lower Leaf -->
  <path d="M 314 335 C 340 335, 347 305, 327 285 C 316 304, 310 320, 314 335 Z" 
        fill="url(#leafGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="2"/>

  <!-- Geometric Architectural Finials (Gold Diamonds at key intersections) -->
  <!-- Top Center Diamond -->
  <polygon points="256,66 264,80 256,94 248,80" fill="url(#goldGrad)"/>
  <!-- Left Zenith Diamond -->
  <polygon points="148,138 154,148 148,158 142,148" fill="url(#goldGrad)"/>
  <!-- Right Zenith Diamond -->
  <polygon points="364,138 370,148 364,158 358,148" fill="url(#goldGrad)"/>
  
  <!-- Subtle Architectural Axis Dots -->
  <circle cx="256" cy="438" r="3.5" fill="url(#goldGrad)"/>
  <circle cx="120" cy="256" r="2.5" fill="url(#goldGrad)" opacity="0.6"/>
  <circle cx="392" cy="256" r="2.5" fill="url(#goldGrad)" opacity="0.6"/>
</svg>
