<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 3x3 Architectural Grid (Wall of Gardens WOG Mark for Light Background) -->
  <!-- Row 1 -->
  <rect x="4" y="4" width="28" height="28" rx="4.5" fill="#101E17"/>
  <rect x="36" y="4" width="28" height="28" rx="4.5" fill="#101E17"/>
  <rect x="68" y="4" width="28" height="28" rx="4.5" fill="#101E17"/>

  <!-- Row 2 -->
  <!-- Col 1: W -->
  <rect x="4" y="36" width="28" height="28" rx="4.5" fill="#101E17"/>
  <path d="M 9.5 42.5 L 13.8 57.5 L 18 47.5 L 22.2 57.5 L 26.5 42.5" 
        fill="none" stroke="#F4F3EC" stroke-width="2.7" stroke-linecap="butt" stroke-linejoin="miter"/>

  <!-- Col 2: O -->
  <rect x="36" y="36" width="28" height="28" rx="4.5" fill="#101E17"/>
  <circle cx="50" cy="50" r="7.4" fill="none" stroke="#F4F3EC" stroke-width="2.7"/>

  <!-- Col 3: G with Botanical Sprout -->
  <rect x="68" y="36" width="28" height="28" rx="4.5" fill="#101E17"/>
  <!-- G Arc & Bar -->
  <path d="M 87.2 45.2 C 85.8 43.6 83.8 42.6 81.5 42.6 C 77.2 42.6 74.4 45.8 74.4 50 C 74.4 54.2 77.4 57.4 82 57.4 C 86.4 57.4 89.2 54.8 89.2 51.2 L 82.2 51.2" 
        fill="none" stroke="#F4F3EC" stroke-width="2.7" stroke-linecap="square"/>
  <!-- Sprout Leaf -->
  <path d="M 87 45.5 C 88.5 42.5 91.5 40 93.8 39.2 C 93.2 42 91 45 88.5 46.2 Z" fill="#F4F3EC"/>

  <!-- Row 3 -->
  <rect x="4" y="68" width="28" height="28" rx="4.5" fill="#101E17"/>
  <rect x="36" y="68" width="28" height="28" rx="4.5" fill="#101E17"/>
  <rect x="68" y="68" width="28" height="28" rx="4.5" fill="#101E17"/>
</svg>
